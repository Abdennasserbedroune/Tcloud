name: TG Store bot

on:
  schedule:
    - cron: "17 * * * *"   # toutes les heures : relance le bot s'il n'est pas déjà en train de tourner
  workflow_dispatch:       # bouton "Run workflow" pour le lancer à la main

permissions:
  contents: read           # le workflow n'a besoin que de lire le code

# Une seule instance à la fois (sinon Telegram renvoie "Conflict").
# La suivante attend en file et démarre dès que la précédente s'arrête : pas de trou.
concurrency:
  group: tgstore-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355   # GitHub coupe à 360 min, on garde de la marge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python bot.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OWNER_IDS: ${{ secrets.OWNER_IDS }}
          CHANNEL_IMAGES: ${{ secrets.CHANNEL_IMAGES }}
          CHANNEL_VIDEOS: ${{ secrets.CHANNEL_VIDEOS }}
          CHANNEL_JEUX: ${{ secrets.CHANNEL_JEUX }}
          CHANNEL_DOCS: ${{ secrets.CHANNEL_DOCS }}
          CHANNEL_INDEX: ${{ secrets.CHANNEL_INDEX }}
          MAX_RUNTIME_MIN: "340"   # arrêt propre + sauvegarde avant la coupure à 355 min
